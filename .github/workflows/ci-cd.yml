# ===========================================================================
# PMTask — CI / CD
# ---------------------------------------------------------------------------
# CI  (every push & PR): install, validate Prisma schema, run unit tests, and
#     verify the production Docker image builds.
# CD  (push to the deploy branch only): trigger a Coolify redeploy via webhook.
#
# Required repository secrets for the deploy step (Settings → Secrets → Actions):
#   COOLIFY_WEBHOOK  Deployment webhook URL from the Coolify resource
#                    (Configuration → Webhooks → Deploy Webhook).
#   COOLIFY_TOKEN    A Coolify API token (Keys & Tokens → API tokens).
# If either secret is missing the deploy step is skipped gracefully, so CI
# still works on forks/PRs without them.
# ===========================================================================

name: CI/CD

on:
  push:
    branches:
      - main
      - claude/docker-compose-coolify-cicd-u8ucz6
  pull_request:
    branches:
      - main

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build image
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pmtask:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: test
    # Only deploy on a direct push to the deploy branch — never on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/docker-compose-coolify-cicd-u8ucz6'
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::warning::COOLIFY_WEBHOOK / COOLIFY_TOKEN not set — skipping deploy."
            exit 0
          fi
          echo "Triggering Coolify redeploy..."
          http_code=$(curl --silent --show-error --write-out "%{http_code}" --output /tmp/coolify_resp \
            --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN")
          echo "Response ($http_code):"
          cat /tmp/coolify_resp || true
          echo
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Coolify returned HTTP $http_code"
            exit 1
          fi
          echo "Deployment triggered successfully."
