# ===========================================================================
# PMTask — Docker Compose for Coolify
# ---------------------------------------------------------------------------
# Deploy this repo on Coolify as a "Docker Compose" resource. Coolify builds
# the `app` image from the Dockerfile, injects environment variables from its
# UI, and manages the reverse proxy + TLS for you.
#
# In Coolify, set at minimum these environment variables (Configuration → Env):
#   SESSION_SECRET   long random string
#   DB_PASSWORD      MySQL password for the app user
#   DB_ROOT_PASSWORD MySQL root password
#   SERVICE_FQDN_APP_3000   (auto-managed by Coolify — maps the domain to :3000)
# Optional: GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_CALLBACK_URL,
#           SEED_ON_START=true (first boot only, to load demo data).
# ===========================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Coolify replaces SERVICE_FQDN_APP_3000 with the assigned domain and
      # wires up the proxy + Let's Encrypt certificate automatically.
      - SERVICE_FQDN_APP_3000
      # --- Database (points at the mysql service below) ---
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-pmtask}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in Coolify}
      - DB_NAME=${DB_NAME:-pmtask}
      # --- Session ---
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in Coolify}
      # --- Google OAuth (optional) ---
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-}
      # --- One-off demo seed (set true only for the first deploy) ---
      - SEED_ON_START=${SEED_ON_START:-false}
    volumes:
      # Persist user uploads (avatars, task attachments, project documents)
      # across redeploys.
      - pmtask-uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in Coolify}
      MYSQL_DATABASE: ${DB_NAME:-pmtask}
      MYSQL_USER: ${DB_USER:-pmtask}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in Coolify}
    volumes:
      - pmtask-db:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pmtask-uploads:
  pmtask-db:
