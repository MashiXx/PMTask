# ===========================================================================
# PMTask — Docker Compose (app only)
# ---------------------------------------------------------------------------
# Runs just the PMTask app; it connects to an EXTERNAL MySQL database.
# Deploy on Coolify as a "Docker Compose" resource, or run locally.
#
# Set these environment variables (Coolify UI, or a local .env file):
#   SESSION_SECRET   long random string
#   DB_HOST          hostname of your MySQL server
#   DB_PORT          MySQL port (default 3306)
#   DB_USER          MySQL user
#   DB_PASSWORD      MySQL password
#   DB_NAME          database name
# Or set a full DATABASE_URL to override the DB_* components entirely.
# Optional: GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_CALLBACK_URL,
#           SEED_ON_START=true (first boot only, to load demo data),
#           SERVICE_FQDN_APP_3000 (auto-managed by Coolify — maps domain to :3000),
#           UPLOADS_PATH  host directory that holds user uploads
#                         (default ./data/uploads, next to this file).
#
# Uploads are bind-mounted from the host so the files stay browsable/backupable
# outside the container and survive rebuilds. No host-side setup needed — the
# entrypoint creates the directory tree and chowns it to uid 1000 on start.
# ===========================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pmtask:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      # Coolify replaces SERVICE_FQDN_APP_3000 with the assigned domain and
      # wires up the proxy + Let's Encrypt certificate automatically.
      - SERVICE_FQDN_APP_3000
      # --- External database ---
      - DB_HOST=${DB_HOST:?set DB_HOST to your external MySQL host}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:?set DB_USER}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - DB_NAME=${DB_NAME:-pmtask}
      # Optional: full connection string, overrides the DB_* components above.
      - DATABASE_URL=${DATABASE_URL:-}
      # --- Session ---
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET}
      # --- Google OAuth (optional) ---
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-}
      # --- One-off demo seed (set true only for the first deploy) ---
      - SEED_ON_START=${SEED_ON_START:-false}
    volumes:
      # Persist user uploads on the host filesystem. One bind mount covers all
      # of them — the app writes everything under /app/uploads:
      #   <projectId>/   project documents
      #   tasks/<id>/    task attachments
      #   avatars/       user avatars
      - /home/mashi/xmashi/PMTask/uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:${PORT:-3000}/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
